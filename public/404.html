<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Opening Appalachian Asenso…</title>
    <script>
      // GitHub Pages serves this file for clean SPA routes. Preserve the route
      // in the query string, then let index.html restore it before React loads.
      (function redirectToApp(location) {
        var pathSegmentsToKeep = 0
        var basePath = location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/')
        var route = location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/')
        var query = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : ''

        location.replace(
          location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
          basePath + '/?/' + route.replace(/&/g, '~and~') + query + location.hash
        )
      }(window.location))
    </script>
  </head>
  <body>
    <p>Opening Appalachian Asenso…</p>
  </body>
</html>
